version: '3.8'

services:
 postgres:
 image: postgres:15-alpine
 environment:
 POSTGRES_USER: askbase
 POSTGRES_PASSWORD: askbase
 POSTGRES_DB: askbase
 ports:
 - "5432:5432"
 volumes:
 - postgres_data:/var/lib/postgresql/data

 redis:
 image: redis:7-alpine
 ports:
 - "6379:6379"

 frontend:
 build:
 context: ./frontend
 dockerfile: Dockerfile
 ports:
 - "3000:3000"
 volumes:
 - ./frontend:/app
 - /app/node_modules
 environment:
 - VITE_API_URL=http://localhost:3001/api
 depends_on:
 - backend

 backend:
 build:
 context: ./ai-backend
 dockerfile: Dockerfile
 ports:
 - "3001:3001"
 volumes:
 - ./ai-backend:/app
 environment:
 - DATABASE_URL=postgresql://askbase:askbase@postgres:5432/askbase
 depends_on:
 - postgres
 - redis

volumes:
 postgres_data:
